<!doctype html>
<html lang="ru">
<head>

  <link rel="stylesheet" href="../../main/styles.css">
  <link rel="stylesheet" href="../../shared/music.css">
  <link rel="stylesheet" href="styles.css?v=nastya-photos-1">
  <script defer src="content.js?v=nastya-photos-1"></script>

<body>
  <main class="nastya-page">

    <h1 class="hand">Настя</h1>

        <a href="#story">История</a>
        <a href="#gallery">Фотографии</a>
